name: Hourly Market Scan

on:
  schedule:
    # Runs at minute 0 every hour between 13:00 and 21:00 UTC, Monday through Friday
    # Covers regular US equity trading hours (9:30 AM - 4:00 PM Eastern)
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch: # Allows manual one-click runs from the GitHub Actions UI

permissions:
  contents: write # Required to commit and push state.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scanner.py

      - name: Commit & Push Updated State Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Only commit and push if state.json actually has changes
          git diff --staged --quiet || (git commit -m "chore: update scanner state cache [skip ci]" && git push)
